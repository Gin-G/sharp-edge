app:
  name: sharp-edge
  group: analytics
frontend:
  enabled: true
  image:
    repository: ncging/sharp-edge-frontend
    tag: a1dfae6
    pullPolicy: Always
  replicas: 1
  port: 80
  fqdn: sharp-edge.nickknows.net
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
backend:
  enabled: true
  image:
    repository: ncging/sharp-edge-backend
    tag: a1dfae6
    pullPolicy: Always
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # The MLB batter screen loads ~450k Statcast events into pandas;
      # 512Mi OOM-killed reliably. 2Gi gives headroom for the scrape +
      # the in-process daily result cache.
      cpu: "1"
      memory: 2Gi
  env:
    LOG_LEVEL: info
  # Persists pybaseball's on-disk Statcast cache across pod restarts so the
  # full 3-season scrape only ever runs once (not on every redeploy).
  pybaseballCache:
    enabled: true
    size: 2Gi
    storageClass: rook-ceph-block
    mountPath: /root/.pybaseball_cache
ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-cloudflare
cnpg:
  enabled: true
  instances: 1
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
  postgresql:
    shared_buffers: "128MB"
    effective_cache_size: "256MB"
  backup:
    enabled: true
    retentionPolicy: "7d"
    snapshotClass: rook-ceph-block
