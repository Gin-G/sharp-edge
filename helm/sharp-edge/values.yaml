app:
  name: sharp-edge
  group: analytics
frontend:
  enabled: true
  image:
    repository: ncging/sharp-edge-frontend
    tag: 90c857b
    pullPolicy: Always
  replicas: 1
  port: 80
  fqdn: sharp-edge.nickknows.net
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
backend:
  enabled: true
  image:
    repository: ncging/sharp-edge-backend
    tag: 90c857b
    pullPolicy: Always
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    LOG_LEVEL: info
ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-cloudflare
cnpg:
  enabled: true
  instances: 1
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
  postgresql:
    shared_buffers: "128MB"
    effective_cache_size: "256MB"
  backup:
    enabled: true
    retentionPolicy: "7d"
    snapshotClass: rook-ceph-block
