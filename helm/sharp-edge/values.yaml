app:
  name: sharp-edge
  group: analytics
frontend:
  enabled: true
  image:
    repository: ncging/sharp-edge-frontend
    tag: "07a50e2"
    pullPolicy: Always
  replicas: 1
  port: 80
  fqdn: sharp-edge.nickknows.net
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
backend:
  enabled: true
  image:
    repository: ncging/sharp-edge-backend
    tag: "07a50e2"
    pullPolicy: Always
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      # The MLB batter screen scrapes Statcast via pybaseball, which builds
      # large intermediate DataFrames during concat. Chunked scrape + dtype
      # downcasts help, but the first cold run still needs real headroom.
      cpu: "1"
      memory: 4Gi
  # Secret holding the genuinely-sensitive values, produced by the
  # ExternalSecret below. Keys:
  #   SESSION_SECRET  required. Signs the session cookie that scopes every
  #                   visitor's data. Without it the app falls back to the
  #                   literal default in config.py, which is public.
  #                   Generate with: openssl rand -hex 32
  #
  # No Anthropic key here — chat keys are supplied per-request by each visitor.
  #
  # Deliberately empty for now. Setting it makes the pod require the key at
  # start — a non-optional secretKeyRef that can't resolve leaves the
  # container in CreateContainerConfigError and takes the site down. Flip it
  # to "sharp-edge-secrets" once the sync is confirmed:
  #   kubectl get externalsecret sharp-edge-secrets -n sharp-edge
  #   kubectl get secret sharp-edge-secrets -n sharp-edge \
  #     -o jsonpath='{.data.SESSION_SECRET}' | head -c 20
  existingSecret: ""
  externalSecrets:
    enabled: true
    secretStoreName: openbao-backend
    secretStoreKind: SecretStore
    openbaoServer: http://openbao.openbao.svc.cluster.local:8200
    openbaoMount: kv
    openbaoPath: sharp-edge
    # SecretStore is namespaced, so this Secret must exist in THIS namespace —
    # it is not shared with whatever namespace already has one.
    credentialsSecret: openbao-credentials
    credentialsKey: OPENBAO_TOKEN
    refreshInterval: 1h
  env:
    LOG_LEVEL: info
    # FanDuel's static app key for direct login (Authorization: Basic on the
    # /sessions call). It's a public value from their JS bundle — capture once
    # from DevTools on the login request, without the "Basic " prefix.
    FANDUEL_BASIC_AUTH: ""
  # Persists pybaseball's on-disk Statcast cache across pod restarts so the
  # full 3-season scrape only ever runs once (not on every redeploy).
  pybaseballCache:
    enabled: true
    size: 2Gi
    storageClass: rook-ceph-block
    mountPath: /root/.pybaseball_cache
ingress:
  enabled: true
  className: traefik
  clusterIssuer: letsencrypt-cloudflare
cnpg:
  enabled: true
  instances: 1
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
  # Bounds added 2026-08-18. Observed peak working set was 91Mi
  # (postgres runs shared_buffers=128MB + work_mem=4MB), so 256Mi requests
  # sits above real usage and the 1Gi limit leaves ~10x headroom for vacuum,
  # index builds and query bursts. CPU limit is loose on purpose: throttling
  # a database is worse than the overcommit it prevents.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    shared_buffers: "128MB"
    effective_cache_size: "256MB"
  backup:
    enabled: true
    retentionPolicy: "7d"
    snapshotClass: rook-ceph-block
