{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sharp-edge.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  {{- if .Values.backend.pybaseballCache.enabled }}
  # The pybaseball cache PVC is ReadWriteOnce; a rolling update tries to
  # attach it to the new pod while the old pod still holds it, which fails
  # with a Multi-Attach error whenever the pods land on different nodes.
  # Recreate terminates the old pod (releasing the volume) first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "sharp-edge.labels" . | nindent 8 }}
        component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sharp-edge.cnpgAppSecret" . }}
                  key: uri
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            {{- if .Values.backend.env.FANDUEL_BASIC_AUTH }}
            - name: FANDUEL_BASIC_AUTH
              value: {{ .Values.backend.env.FANDUEL_BASIC_AUTH | quote }}
            {{- end }}
            {{- if .Values.backend.existingSecret }}
            # Rotating SESSION_SECRET invalidates every issued cookie. Each
            # visitor gets a new uid, and any FanDuel session stored under the
            # old uid is orphaned — expect to log in again after a change.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: SESSION_SECRET
            {{- end }}
            - name: CORS_ORIGINS
              value: {{ printf "[\"https://%s\"]" .Values.frontend.fqdn | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            {{- if .Values.backend.pybaseballCache.enabled }}
            - name: HOME
              value: "/root"
            {{- end }}
          {{- if .Values.backend.pybaseballCache.enabled }}
          volumeMounts:
            - name: pybaseball-cache
              mountPath: {{ .Values.backend.pybaseballCache.mountPath }}
          {{- end }}
          # No liveness or readiness probe, deliberately.
          #
          # Measured during a cold warm-up, /health takes 30+ seconds to
          # answer — three consecutive 30s curl timeouts, then 15.4s, then
          # instant once the scrape passed. The event loop is not slow, it is
          # blocked outright: the batter screen's background thread holds the
          # GIL through long stretches of DataFrame work. No probe timeout can
          # sensibly cover a 30-second stall.
          #
          # Given that, both probes only did harm. Liveness read the stall as a
          # dead process and SIGKILLed the pod (exit 137) about 90 seconds in;
          # it restarted, began the same warm-up, and was killed again — six
          # restarts on 2026-08-21, and the picks list stayed empty all day
          # while the track record still showed picks from a day the warm-up
          # had survived. Readiness emptied the Service, and with one replica
          # there is nowhere else to send traffic, so the ingress answered "no
          # available server" instead of the 503-with-Retry-After the pod would
          # have served and the frontend already polls.
          #
          # So nothing here restarts the pod automatically any more. That is a
          # real trade: a genuinely wedged process now stays wedged until
          # someone restarts it. It is the better trade while a healthy pod is
          # indistinguishable from a wedged one for half a minute at a time.
          #
          # Put a liveness probe back once the scrape no longer runs inside the
          # API process — at that point /health answers in milliseconds and a
          # stall means something is actually wrong.
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.pybaseballCache.enabled }}
      volumes:
        - name: pybaseball-cache
          persistentVolumeClaim:
            claimName: {{ .Values.app.name }}-pybaseball-cache
      {{- end }}
{{- end }}
