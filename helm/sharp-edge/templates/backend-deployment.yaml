{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sharp-edge.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  {{- if .Values.backend.pybaseballCache.enabled }}
  # The pybaseball cache PVC is ReadWriteOnce; a rolling update tries to
  # attach it to the new pod while the old pod still holds it, which fails
  # with a Multi-Attach error whenever the pods land on different nodes.
  # Recreate terminates the old pod (releasing the volume) first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "sharp-edge.labels" . | nindent 8 }}
        component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "sharp-edge.cnpgAppSecret" . }}
                  key: uri
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            {{- if .Values.backend.env.FANDUEL_BASIC_AUTH }}
            - name: FANDUEL_BASIC_AUTH
              value: {{ .Values.backend.env.FANDUEL_BASIC_AUTH | quote }}
            {{- end }}
            {{- if .Values.backend.existingSecret }}
            # Rotating SESSION_SECRET invalidates every issued cookie. Each
            # visitor gets a new uid, and any FanDuel session stored under the
            # old uid is orphaned — expect to log in again after a change.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: SESSION_SECRET
            {{- end }}
            - name: CORS_ORIGINS
              value: {{ printf "[\"https://%s\"]" .Values.frontend.fqdn | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            {{- if .Values.backend.pybaseballCache.enabled }}
            - name: HOME
              value: "/root"
            {{- end }}
          {{- if .Values.backend.pybaseballCache.enabled }}
          volumeMounts:
            - name: pybaseball-cache
              mountPath: {{ .Values.backend.pybaseballCache.mountPath }}
          {{- end }}
          # Probe budgets are sized for the batter screen's cold warm-up, not
          # for a healthy idle pod, because the warm-up is what kills it.
          #
          # The screen scrapes Statcast through pybaseball on a background
          # thread, and that work is pandas — it holds the GIL. The container
          # is capped at 1 CPU, so while it runs the event loop cannot answer
          # /health inside the default 1s timeout. With the defaults (1s,
          # 3 failures, 30s period) three probes fail in a row and the kubelet
          # SIGKILLs the pod about 90 seconds in. It restarts, starts the same
          # warm-up, and is killed again: the screen can never finish, and the
          # picks list is empty all day while the track record still shows the
          # picks from a day the warm-up did survive. That is the crash loop
          # seen on 2026-08-21, and the same mechanism EXPERIMENTS.md records
          # for the backfill.
          #
          # startupProbe holds liveness off entirely until the first warm-up
          # lands — 10 minutes of headroom, and the pod is killed only if it
          # genuinely never comes up.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # After startup, a mid-day re-warm can still starve the loop for a
          # while. Three minutes of silence before a restart is tolerant of
          # that and still catches a genuinely wedged process.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Deliberately slack. The API answers 503 with a Retry-After while
          # the cache is cold, which the frontend knows how to poll — that is
          # a far better experience than being pulled out of the Service and
          # serving "no available server" from the ingress.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.pybaseballCache.enabled }}
      volumes:
        - name: pybaseball-cache
          persistentVolumeClaim:
            claimName: {{ .Values.app.name }}-pybaseball-cache
      {{- end }}
{{- end }}
