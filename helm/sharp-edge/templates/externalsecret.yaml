{{- if and .Values.backend.externalSecrets .Values.backend.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.backend.externalSecrets.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sharp-edge.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      auth:
        tokenSecretRef:
          key: {{ .Values.backend.externalSecrets.credentialsKey }}
          name: {{ .Values.backend.externalSecrets.credentialsSecret }}
      path: {{ .Values.backend.externalSecrets.openbaoMount }}
      server: {{ .Values.backend.externalSecrets.openbaoServer }}
      version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.app.name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sharp-edge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.backend.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.backend.externalSecrets.secretStoreName }}
    kind: {{ .Values.backend.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.app.name }}-secrets
    creationPolicy: Owner
  # extract, not an explicit key list: it syncs whatever is at the path, so
  # adding another key in OpenBao later needs no chart change. Naming a key
  # that doesn't exist yet would fail the whole sync — including
  # SESSION_SECRET, which the pod needs to start.
  dataFrom:
    - extract:
        key: {{ .Values.backend.externalSecrets.openbaoPath }}
{{- end }}
