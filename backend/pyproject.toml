[project]
name = "sharp-edge"
version = "0.1.0"
description = "Sports betting analytics platform with FanDuel integration and Claude-powered analysis"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "anthropic>=0.40.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
models = [
    "pybaseball>=2.3.0",
    "nba_api>=1.5.0",
    "nfl_data_py>=0.3.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
]

[project.scripts]
sharp-edge-mcp = "sharp_edge.server:main"
sharp-edge-api = "sharp_edge.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
