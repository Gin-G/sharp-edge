name: Post-deploy smoke

# Runs after "Build and bump" succeeds (ArgoCD then rolls the new images) and
# probes the live API. The /picks/* endpoints double as a "new code is
# actually serving" check, since a stale pod would 404 them.
#
# The public DNS record is proxied through Cloudflare, whose managed
# challenge blocks CI runners outright (403 + cf-mitigated: challenge) — it
# keys on client reputation, not User-Agent, so there is nothing to spoof.
# Rather than punch a hole in the WAF, the probe pins the hostname straight
# to the ingress with curl --resolve. The hostname stays in SNI and the Host
# header, so Traefik still routes by host and cert validation is unchanged;
# only Cloudflare is skipped.
#
# ORIGIN must match the external-dns target on helm/sharp-edge/templates/
# ingress.yaml. If the cluster's public IP changes, update both.

on:
  workflow_run:
    workflows: ["Build and bump"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe live API
        run: |
          HOST=sharp-edge.nickknows.net
          ORIGIN=8.44.158.127
          BASE="https://$HOST/api"

          # Truncate both files first: on a timeout curl may never write, and a
          # stale body from an earlier probe would then satisfy the next grep.
          # That reads as a pass for an endpoint that never answered.
          probe() {  # $1 = path; body -> /tmp/b, status -> $code
            : > /tmp/b; : > /tmp/h
            code=$(curl -sS --max-time 20 --resolve "$HOST:443:$ORIGIN" \
                     -D /tmp/h -o /tmp/b -w '%{http_code}' "$BASE$1" || echo 000)
            if grep -qi '^cf-mitigated: challenge' /tmp/h; then
              echo "::error::Cloudflare answered instead of the origin — the --resolve pin is not taking effect, or $ORIGIN is stale (check the external-dns target in ingress.yaml)."
              exit 1
            fi
          }

          expect() {  # $1 = path, $2 = string the body must contain
            probe "$1"
            if [ "$code" != "200" ]; then
              echo "::error::$1 returned HTTP $code"; exit 1
            fi
            if ! grep -q "$2" /tmp/b; then
              echo "::error::$1 did not contain $2"; head -c 300 /tmp/b; exit 1
            fi
            echo "ok  $1"
          }

          # ArgoCD sync + image pull + pod rollout can take a while; retry the
          # newest endpoint until the fresh pod is serving (up to 15 min).
          ok=""
          for i in $(seq 1 30); do
            probe "/picks/track-record?screen=hr"
            if [ "$code" = "200" ] && grep -q '"overall"' /tmp/b; then ok=1; break; fi
            echo "new pod not serving yet (attempt $i/30, HTTP $code)"; sleep 30
          done
          [ -n "$ok" ] || { echo "::error::track-record endpoint never came up"; exit 1; }

          expect "/health" '"ok"'
          expect "/homers/screen/status" '"available"'
          expect "/batters/screen/status" '"available"'
          expect "/picks/track-record?screen=batter" '"overall"'
          expect "/picks/backfill/status" '"running"'
          echo "smoke OK"
