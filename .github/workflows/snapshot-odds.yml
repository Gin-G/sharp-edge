name: Daily odds snapshot

# Records FanDuel's to-record-a-hit prices for the day's slate and commits them
# to data/odds/.
#
# This exists because odds are not retrievable after the fact. FanDuel serves
# the current board and nothing else, so a price that has moved is gone for
# good — which is why bundle_backtest.py can only report ROI as a function of
# an *assumed* price rather than a real one. Every day this job doesn't run is
# a day that can never be backtested properly. That makes it the rare research
# job worth putting on a schedule.
#
# Passes accumulate through the day rather than replacing each other, because
# the number that actually matters is the *closing* price. Beating an opening
# line mostly means being early; beating the close means being right, since by
# then the market has absorbed lineups, weather, scratches and whatever the
# sharp money knew.
#
# "Before first pitch" is per-game, not per-slate — the card runs from about
# 12:35pm to 10:10pm ET, so no single pass is near the bell for more than a
# few games. Hence a pass ahead of each start cluster. Every row records
# mins_to_start, and a batter's close is his last row still positive on it.
#
#   15:00 UTC  11am ET   full pass — the only one that joins to the board, so
#                        it pays for Statcast (~3 min). Everything after it is
#                        --prices-only and takes seconds.
#   16:20 UTC  12:20pm   ahead of the ~12:35pm day games
#   19:50 UTC   3:50pm   ahead of the ~4:05pm afternoon games
#   22:50 UTC   6:50pm   ahead of the 6:40/7:05pm cluster, most of the card
#   23:55 UTC   7:55pm   ahead of the ~8:10pm starts
#   01:25 UTC   9:25pm   ahead of the west-coast 9:40/10:10pm starts
#
# The cheap passes cost seconds each, so the whole day is a few minutes of
# runner time on top of the one full pass.

on:
  schedule:
    - cron: '0 15 * * *'    # full pass, with board context
    - cron: '20 16 * * *'   # close: day games
    - cron: '50 19 * * *'   # close: afternoon
    - cron: '50 22 * * *'   # close: main evening cluster
    - cron: '55 23 * * *'   # close: late evening
    - cron: '25 1 * * *'    # close: west coast
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date (YYYY-MM-DD, blank = today)'
        default: ''
      state:
        description: 'FanDuel state code (affects the API subdomain)'
        default: 'CO'
      prices_only:
        description: 'Skip the board join (seconds instead of minutes)'
        type: boolean
        default: false

permissions:
  contents: write

# Two passes must never overlap: appending to the day's file is a
# read-modify-write, and a closing pass starting while the full pass is still
# going would lose whichever wrote first.
concurrency:
  group: snapshot-odds
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Generous only for the full pass, which loads Statcast. The closing
    # passes finish in seconds.
    timeout-minutes: 45
    env:
      SHARP_EDGE_CACHE_DIR: ${{ github.workspace }}/.cache/statcast
      ODDS_DIR: ${{ github.workspace }}/data/odds
    steps:
      # Full history: the commit step rebases onto main, which a shallow
      # clone can't do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install --no-deps -e backend/

      # Shares the rolling-key pattern with the backtest workflow: write a new
      # key each run, restore from the newest prefix match.
      - name: Restore Statcast cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SHARP_EDGE_CACHE_DIR }}
          key: snapshot-odds-${{ github.run_id }}
          restore-keys: |
            snapshot-odds-
            backtest-batters-

      # Only the 15:00 pass joins to the board. The rest just need prices, and
      # skipping the join turns a 3-minute job into a 5-second one.
      - name: Decide pass type
        id: pass
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
              echo "flag=" >> "$GITHUB_OUTPUT"
              echo "kind=full (with board context)" >> "$GITHUB_OUTPUT"
            else
              echo "flag=--prices-only" >> "$GITHUB_OUTPUT"
              echo "kind=closing (prices only)" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ inputs.prices_only }}" = "true" ]; then
            echo "flag=--prices-only" >> "$GITHUB_OUTPUT"
            echo "kind=closing (prices only)" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "kind=full (with board context)" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot odds
        run: |
          echo "pass: ${{ steps.pass.outputs.kind }}"
          python backend/scripts/snapshot_odds.py \
            --dir "$ODDS_DIR" \
            --state "${{ inputs.state || 'CO' }}" \
            ${{ steps.pass.outputs.flag }} \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Summarise
        if: always()
        run: |
          if ! ls "$ODDS_DIR"/odds_*.parquet >/dev/null 2>&1; then
            printf '## Odds snapshot\n\nNo snapshot written — see the job log.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python backend/scripts/snapshot_odds.py --dir "$ODDS_DIR" --summary > summary.txt
          {
            echo "## Odds snapshot"
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds
          if git diff --cached --quiet; then
            echo "no odds changes to commit"
            exit 0
          fi
          git commit -m "odds: ${{ steps.pass.outputs.kind }} snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          # The schedule can collide with a push to main; rebase and retry
          # rather than failing a run whose data is already fetched.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
