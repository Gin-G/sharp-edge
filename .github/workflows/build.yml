name: Build and bump

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt pytest
          pip install --no-deps -e backend/

      - name: Run backend tests
        run: pytest backend/tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PW }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/sharp-edge-backend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKER_USER }}/sharp-edge-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USER }}/sharp-edge-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USER }}/sharp-edge-backend:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE=https://sharp-edge.nickknows.net/api
          tags: |
            ${{ secrets.DOCKER_USER }}/sharp-edge-frontend:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKER_USER }}/sharp-edge-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USER }}/sharp-edge-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USER }}/sharp-edge-frontend:buildcache,mode=max

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Pull first, then write the tag, then push — in that order, and it
      # matters. The old step wrote the tag, committed, and *then* rebased onto
      # whatever had landed meanwhile. Two pushes close together therefore
      # produced two bump commits editing the same line of values.yaml, and the
      # rebase conflicted every time. That is not a rare race: it happened the
      # first day two commits went out minutes apart, and the failure is quiet
      # in the worst way — the image builds and pushes fine, only the tag never
      # lands, so the cluster keeps running the previous build while CI shows a
      # red square nobody connects to a stale deploy.
      - name: Bump image tags and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            yq -i ".backend.image.tag = \"${TAG}\"" helm/sharp-edge/values.yaml
            yq -i ".frontend.image.tag = \"${TAG}\"" helm/sharp-edge/values.yaml

            git add helm/sharp-edge/values.yaml
            if git diff --staged --quiet; then
              echo "values.yaml already at ${TAG} — nothing to commit"
              exit 0
            fi

            git commit -m "ci: bump images to ${TAG}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — someone else landed first, retrying"
          done

          echo "::error::could not bump values.yaml to ${TAG} after 3 attempts"
          exit 1
