name: Batter screen backtest

# Replays the batter screen over past slates and scores candidate rule sets
# against what actually happened. Manual only — it is a research job, not CI.
#
# Two phases, split because they have completely different costs:
#
#   build  Hits StatsAPI / Baseball Savant / Baseball-Reference for every date
#          in the range and writes one settled board per day. Slow (tens of
#          minutes for a season) and the only part that needs network.
#   eval   Pure pandas over those boards. Seconds. Rerun it as often as you
#          like with different variants or thresholds — no refetching.
#
# The boards are cached between runs, so the first run pays for the scrape and
# every run after it is nearly free. Results land in the job summary.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build+eval | eval | sweep'
        type: choice
        options: [build+eval, eval, sweep]
        default: build+eval
      start:
        description: 'First slate date (YYYY-MM-DD)'
        default: '2026-04-01'
      end:
        description: 'Last slate date (YYYY-MM-DD, blank = yesterday)'
        default: ''
      since:
        description: 'Score only boards on/after this date (blank = all)'
        default: ''
      variants:
        description: 'Comma-separated variant subset (blank = all)'
        default: ''
      sweep_param:
        description: 'sweep mode: sharp_h9 | sharp_baa | hittable_h9 | hittable_baa | hits_l3 | bvp_pa'
        default: 'sharp_h9'
      sweep_range:
        description: 'sweep mode: lo hi step'
        default: '5.0 9.0 0.5'
      rebuild:
        description: 'Rebuild dates already cached'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    # A cold cache means scraping three Statcast seasons plus a slate a day.
    timeout-minutes: 330
    env:
      # Keep both caches inside the workspace so the cache action can see them.
      SHARP_EDGE_CACHE_DIR: ${{ github.workspace }}/.cache/statcast
      BOARDS_DIR: ${{ github.workspace }}/.cache/boards
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt
          pip install --no-deps -e backend/

      # Rolling cache: each run writes a new key and restores from the newest
      # prefix match, so boards accumulate instead of being rebuilt.
      - name: Restore Statcast + board cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SHARP_EDGE_CACHE_DIR }}
            ${{ env.BOARDS_DIR }}
          key: backtest-batters-${{ github.run_id }}
          restore-keys: backtest-batters-

      - name: Build boards
        if: inputs.mode == 'build+eval'
        run: |
          python backend/scripts/backtest_batters.py \
            --dir "$BOARDS_DIR" \
            build \
            --start "${{ inputs.start }}" \
            ${{ inputs.end && format('--end {0}', inputs.end) || '' }} \
            ${{ inputs.rebuild && '--force' || '' }}

      - name: Score variants
        if: inputs.mode != 'sweep'
        run: |
          python backend/scripts/backtest_batters.py \
            --dir "$BOARDS_DIR" \
            eval \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            ${{ inputs.variants && format('--variants {0}', inputs.variants) || '' }} \
            | tee report.txt

      - name: Sweep threshold
        if: inputs.mode == 'sweep'
        run: |
          read -r LO HI STEP <<< "${{ inputs.sweep_range }}"
          python backend/scripts/backtest_batters.py \
            --dir "$BOARDS_DIR" \
            sweep --param "${{ inputs.sweep_param }}" \
            --lo "$LO" --hi "$HI" --step "$STEP" \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            | tee report.txt

      - name: Publish to job summary
        if: always() && hashFiles('report.txt') != ''
        run: |
          {
            echo "## Batter screen backtest"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boards and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-batters
          path: |
            report.txt
            ${{ env.BOARDS_DIR }}
          if-no-files-found: warn
          retention-days: 30
